<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wavy Background</title>

  <link rel="stylesheet" href="background.css">
</head>

<body>

  <div class="background">
    <svg class="waves"
         viewBox="0 0 1200 1200"
         preserveAspectRatio="xMidYMid slice"
    >

      <g class="wave-group">
        <!-- Wave path generated by JavaScript -->
        <script>
          const waveGroup = document.querySelector('.wave-group');
          const waveCount = 26; // Number of waves
          const waveHeight = 50; // Height of each wave
          const waveLength = 200; // Length of each wave
          const waveFinalDown = 150; // Final downward offset for the waves
          const initialHeight = -150; // Initial height of the first wave

          for (let i = 0; i < waveCount; i++) {
            const randomOne = getRandomInteger(-15, 15); // Random value to add variation to the waves height
            const randomTwo = getRandomInteger(-15, 15); // Random value to add variation to the waves
            const randomThree = getRandomInteger(-15, 15); // Random value to add variation to the waves
            const randomFour = getRandomInteger(-15, 15); // Random value to add variation to the waves
            const randomFive = getRandomInteger(-15, 15); // Random value to add variation to the waves
            
            const yOffset = i * waveHeight + initialHeight;
            const pathData = `
              M-100 ${yOffset}
              C100 ${(yOffset - waveHeight) / 1.3}, ${180  + randomOne} ${yOffset + waveHeight}, ${300  + randomTwo} ${yOffset + waveFinalDown}
              S500 ${yOffset - waveHeight}, ${700  + randomThree} ${yOffset + waveFinalDown}
              S900 ${yOffset + waveFinalDown}, ${1100  + randomFour} ${yOffset + waveFinalDown + 100}
              S1300 ${yOffset - waveHeight}, ${1400  + randomFive} ${yOffset + waveFinalDown}
            `;
            const pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            pathElement.setAttribute('d', pathData);
            waveGroup.appendChild(pathElement);
          }

          // Proved that the function works fine even with negative values
          function getRandomInteger(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
          }
        </script>

      </g>

    </svg>
  </div>

</body>
</html>
