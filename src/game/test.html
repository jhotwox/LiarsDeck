<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wavy Background</title>

  <link rel="stylesheet" href="background.css">
</head>

<body>

  <div class="background">
    <svg class="waves"
         viewBox="0 0 1200 1200"
         preserveAspectRatio="xMidYMid slice"
    >

      <g class="wave-group">
        <path d="M-100 50
                 C100 0, 180 100, 300 50
                 S500 0, 700 50
                 S900 100, 1100 50
                 S1300 0, 1400 50" />

        <path d="M-100 100
                 C100 50, 180 150, 300 100
                 S500 50, 700 100
                 S900 150, 1100 100
                 S1300 50, 1400 100" />

        <path d="M-100 150
                 C100 100, 180 200, 300 150
                 S500 100, 700 150
                 S900 200, 1100 150
                 S1300 100, 1400 150" />

        <path d="M-100 200
                 C100 150, 180 250, 300 200
                 S500 150, 700 200
                 S900 250, 1100 200
                 S1300 150, 1400 200" />

        <path d="M-100 250
                 C100 200, 180 300, 300 250
                 S500 200, 700 250
                 S900 300, 1100 250
                 S1300 200, 1400 250" />

        <path d="M-100 300
                 C100 250, 180 350, 300 300
                 S500 250, 700 300
                 S900 350, 1100 300
                 S1300 250, 1400 300" />

        <path d="M-100 350
                 C100 300, 180 400, 300 350
                 S500 300, 700 350
                 S900 400, 1100 350
                 S1300 300, 1400 350" />

        <path d="M-100 400
                 C100 350, 180 450, 300 400
                 S500 350, 700 400
                 S900 450, 1100 400
                 S1300 350, 1400 400" />

        <path d="M-100 450
                 C100 400, 180 500, 300 450
                 S500 400, 700 450
                 S900 500, 1100 450
                 S1300 400, 1400 450" />

        <path d="M-100 500
                 C100 450, 180 550, 300 500
                 S500 450, 700 500
                 S900 550, 1100 500
                 S1300 450, 1400 500" />

        <path d="M-100 550
                 C100 500, 180 600, 300 550
                 S500 500, 700 550
                 S900 600, 1100 550
                 S1300 500, 1400 550" />

        <path d="M-100 600
                 C100 550, 180 650, 300 600
                 S500 550, 700 600
                 S900 650, 1100 600
                 S1300 550, 1400 600" />

        <path d="M-100 650
                 C100 600, 180 700, 300 650
                 S500 600, 700 650
                 S900 700, 1100 650
                 S1300 600, 1400 650" />

        <path d="M-100 700
                 C100 650, 180 750, 300 700
                 S500 650, 700 700
                 S900 750, 1100 700
                 S1300 650, 1400 700" />

        <path d="M-100 750
                 C100 700, 180 800, 300 750
                 S500 700, 700 750
                 S900 800, 1100 750
                 S1300 700, 1400 750" />

        <path d="M-100 800
                 C100 750, 180 850, 300 800
                 S500 750, 700 800
                 S900 850, 1100 800
                 S1300 750, 1400 800" />

        <path d="M-100 850
                 C100 800, 180 900, 300 850
                 S500 800, 700 850
                 S900 900, 1100 850
                 S1300 800, 1400 850" />

        <path d="M-100 900
                 C100 850, 180 950, 300 900
                 S500 850, 700 900
                 S900 950, 1100 900
                 S1300 850, 1400 900" />

        <path d="M-100 950
                 C100 900, 180 1000, 300 950
                 S500 900, 700 950
                 S900 1000, 1100 950
                 S1300 900, 1400 950" />

        <path d="M-100 1000
                 C100 950, 180 1050, 300 1000
                 S500 950, 700 1000
                 S900 1050, 1100 1000
                 S1300 950, 1400 1000" />

        <path d="M-100 1050
                 C100 1000, 180 1100, 300 1050
                 S500 1000, 700 1050
                 S900 1100, 1100 1050
                 S1300 1000, 1400 1050" />

        <path d="M-100 1100
                 C100 1050, 180 1150, 300 1100
                 S500 1050, 700 1100
                 S900 1150, 1100 1100
                 S1300 1050, 1400 1100" />

        <path d="M-100 1150
                 C100 1100, 180 1200, 300 1150
                 S500 1100, 700 1150
                 S900 1200, 1100 1150
                 S1300 1100, 1400 1150" />

      </g>

    </svg>
  </div>

</body>
</html>
